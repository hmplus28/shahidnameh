    <path d="M0 -22 C-8 -22 -14 -16 -14 -8 C-14 -4 -11 -1 -7 0 C-11 1 -14 4 -14 8 C-14 16 -8 22 0 22 C8 22 14 16 14 8 C14 4 11 1 7 0 C11 -1 14 -4 14 -8 C14 -16 8 -22 0 -22 Z" fill="#c75050" stroke="#a33d3d" stroke-width="1.2"/>
