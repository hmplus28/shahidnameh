  <path d="M96 122 Q94 130 90 138" stroke="#2d6b3f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M90 138 Q86 132 80 134 Q83 139 90 138 Z" fill="#2d6b3f"/>
