    <radialGradient id="haloGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ead7aa" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#ead7aa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" rx="43" fill="url(#bgGrad)"/>
  <circle cx="96" cy="88" r="70" fill="url(#haloGrad)"/>
  <!-- هلال تذهیبی -->
  <path d="M96 26c-30 23-46 53-46 84 0 16 6 28 16 36h60c10-8 16-20 16-36 0-31-15-61-46-84Z" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
