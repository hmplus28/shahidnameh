<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="آفلاین">
  <defs>
    <linearGradient id="offGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#285c56"/>
      <stop offset="100%" stop-color="#173f3d"/>
    </linearGradient>
  </defs>
  <!-- چارچوب کاشی -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="url(#offGrad)" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#bd9345" stroke-width=".5" stroke-dasharray="3 2"/>
  <!-- هلال آویز (نماد آفلاین = هلال خاموش) -->
  <g transform="translate(32,30)">
    <path d="M -10 -12 A 13 13 0 1 0 -10 12 A 10 10 0 1 1 -10 -12 Z" fill="url(#offGrad)" stroke="#0d2a28" stroke-width="1.2"/>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#a33d3d" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- ستاره پایین -->
  <g transform="translate(32,52)" fill="#bd9345">
    <path d="M0 -3 L1 -1 L3 0 L1 1 L0 3 L-1 1 L-3 0 L-1 -1 Z"/>
  </g>
</svg>
