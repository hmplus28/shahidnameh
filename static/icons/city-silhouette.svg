<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" preserveAspectRatio="none" role="img" aria-label="سیلوئت یادمان شهدا">
  <defs>
    <linearGradient id="silGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#173f3d" stop-opacity=".0"/>
      <stop offset="60%" stop-color="#173f3d" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#173f3d" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="silGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bd9345" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#bd9345" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="120" width="1200" height="60" fill="url(#silGlow)"/>
  <!-- یادمان شهدای تهران-سبزوار -->
  <g fill="url(#silGrad)">
    <!-- گنبد و مناره -->
    <path d="M120 90 L120 130 L180 130 L180 90 Q180 65 150 55 Q120 65 120 90 Z"/>
    <rect x="100" y="60" width="6" height="70"/>
    <circle cx="103" cy="58" r="6"/>
    <rect x="194" y="60" width="6" height="70"/>
    <circle cx="197" cy="58" r="6"/>
    <path d="M140 130 L140 105 Q150 95 160 105 L160 130 Z"/>
    <!-- درخت کاج سیلوئت -->
    <path d="M260 130 L260 95 L255 95 L268 70 L262 70 L275 50 L268 50 L285 25 L302 50 L295 50 L308 70 L302 70 L315 95 L310 95 L310 130 Z"/>
    <!-- خانه‌های سیلوئت -->
    <rect x="330" y="100" width="50" height="30"/>
    <path d="M328 100 L355 80 L382 100 Z"/>
    <rect x="388" y="110" width="40" height="20"/>
    <path d="M386 110 L408 95 L430 110 Z"/>
    <!-- خاکریز جنگل -->
    <path d="M450 130 Q470 100 490 130 Q510 95 530 130 Q550 105 570 130 Z"/>
    <!-- برج یادمان بلند با لاله -->
    <rect x="620" y="40" width="20" height="90"/>
    <path d="M615 45 L630 25 L645 45 Z"/>
    <path d="M625 25 L625 18 Q630 18 630 25" fill="none" stroke="#bd9345" stroke-width="1.5"/>
    <circle cx="630" cy="14" r="3" fill="#bd9345"/>
    <!-- لاله بزرگ روی برج -->
    <g transform="translate(630,55)">
      <path d="M0 -10 C-5 -10 -9 -7 -9 -3 C-9 -1 -4 0 0 0 C4 0 9 -1 9 -3 C9 -7 5 -10 0 -10 Z" fill="#a33d3d" opacity=".85"/>
    </g>
    <!-- گنبد مسجد کوچک -->
    <path d="M680 130 L680 100 Q680 80 700 70 Q720 80 720 100 L720 130 Z"/>
    <rect x="660" y="80" width="4" height="50"/>
    <circle cx="662" cy="78" r="4"/>
    <rect x="736" y="80" width="4" height="50"/>
    <circle cx="738" cy="78" r="4"/>
    <!-- خانه‌های ردیفی -->
    <rect x="770" y="100" width="40" height="30"/>
    <rect x="810" y="105" width="50" height="25"/>
    <rect x="860" y="100" width="40" height="30"/>
    <path d="M768 100 L790 85 L812 100 Z"/>
    <path d="M858 100 L880 85 L902 100 Z"/>
    <!-- درختان -->
    <path d="M950 130 L950 100 L945 100 L960 75 L953 75 L970 50 L963 50 L985 25 L1007 50 L1000 50 L1017 75 L1010 75 L1025 100 L1020 100 L1020 130 Z"/>
    <!-- گنبد بزرگ سمت چپ -->
    <path d="M1080 130 L1080 90 Q1080 60 1130 50 Q1180 60 1180 90 L1180 130 Z"/>
    <rect x="1058" y="55" width="6" height="75"/>
    <circle cx="1061" cy="53" r="5"/>
    <rect x="1196" y="55" width="6" height="75"/>
    <circle cx="1199" cy="53" r="5"/>
    <path d="M1100 130 L1100 105 Q1130 90 1160 105 L1160 130 Z"/>
    <!-- لاله صحرایی پراکنده -->
    <g transform="translate(420,100)" fill="#a33d3d" opacity=".7">
      <path d="M0 -8 C-4 -8 -7 -5 -7 -2 C-7 -1 -3 0 0 0 C3 0 7 -1 7 -2 C7 -5 4 -8 0 -8 Z"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2d6b3f" stroke-width="1.5"/>
    </g>
    <g transform="translate(560,110)" fill="#a33d3d" opacity=".6">
      <path d="M0 -7 C-3 -7 -6 -4 -6 -2 C-6 -1 -3 0 0 0 C3 0 6 -1 6 -2 C6 -4 3 -7 0 -7 Z"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2d6b3f" stroke-width="1.5"/>
    </g>
    <g transform="translate(750,108)" fill="#a33d3d" opacity=".65">
      <path d="M0 -7 C-3 -7 -6 -4 -6 -2 C-6 -1 -3 0 0 0 C3 0 6 -1 6 -2 C6 -4 3 -7 0 -7 Z"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2d6b3f" stroke-width="1.5"/>
    </g>
    <g transform="translate(920,115)" fill="#a33d3d" opacity=".55">
      <path d="M0 -6 C-3 -6 -5 -4 -5 -2 C-5 -1 -3 0 0 0 C3 0 5 -1 5 -2 C5 -4 3 -6 0 -6 Z"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2d6b3f" stroke-width="1.5"/>
    </g>
  </g>
</svg>
