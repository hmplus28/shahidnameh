<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="پرونده شهید">
  <defs>
    <linearGradient id="bgAvatar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4ece5"/>
      <stop offset="100%" stop-color="#b6c9bd"/>
    </linearGradient>
    <linearGradient id="kafAvatar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4a44"/>
      <stop offset="100%" stop-color="#0d2a28"/>
    </linearGradient>
    <pattern id="kafPatt" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#173f3d"/>
      <path d="M0 5 L10 5 M5 0 L5 10" stroke="#f5f1e8" stroke-width=".8"/>
      <path d="M0 0 L10 10 M10 0 L0 10" stroke="#bd9345" stroke-width=".4" opacity=".7"/>
    </pattern>
  </defs>
  <!-- پس‌زمینه -->
  <rect width="200" height="200" fill="url(#bgAvatar)"/>
  <!-- قاب دایره‌ای تذهیبی -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#bd9345" stroke-width="2"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#bd9345" stroke-width=".8" stroke-dasharray="3 3"/>
  <!-- سیلوئت سر و شانه‌های شهید با چفیه -->
  <g transform="translate(100,100)">
    <!-- شانه‌ها -->
    <path d="M-65 70 Q-65 30 -45 18 Q-25 8 0 8 Q25 8 45 18 Q65 30 65 70 Z" fill="url(#kafAvatar)"/>
    <!-- سر -->
    <circle cx="0" cy="-12" r="36" fill="url(#kafAvatar)"/>
    <!-- چفیه روی سر (با پترن) -->
    <path d="M-36 -12 Q-36 -48 0 -48 Q36 -48 36 -12 Q36 -28 0 -28 Q-36 -28 -36 -12 Z" fill="url(#kafPatt)" stroke="#0d2a28" stroke-width=".5"/>
    <!-- لبه آویز چفیه -->
    <path d="M-36 -12 Q-30 -6 -20 -10 Q-10 -16 0 -14 Q10 -16 20 -10 Q30 -6 36 -12 L36 -6 Q30 0 20 -2 Q10 -6 0 -4 Q-10 -6 -20 -2 Q-30 0 -36 -6 Z" fill="url(#kafPatt)" stroke="#0d2a28" stroke-width=".5"/>
    <!-- لاله قرمز روی پیشانی (نماد شهادت) -->
    <g transform="translate(0,-32)">
      <path d="M0 -10 C-4 -10 -7 -7 -7 -4 C-7 -2 -3 -1 0 -1 C3 -1 7 -2 7 -4 C7 -7 4 -10 0 -10 Z" fill="#a33d3d" stroke="#7a2a2a" stroke-width=".8"/>
      <path d="M0 -10 L0 4" stroke="#7a2a2a" stroke-width=".6" opacity=".6"/>
    </g>
    <!-- قاب تذهیب پایین -->
    <path d="M-40 60 L40 60" stroke="#bd9345" stroke-width="1.5"/>
    <g transform="translate(-44,60)" fill="#bd9345">
      <path d="M0 -3 L1 -1 L3 0 L1 1 L0 3 L-1 1 L-3 0 L-1 -1 Z"/>
    </g>
    <g transform="translate(44,60)" fill="#bd9345">
      <path d="M0 -3 L1 -1 L3 0 L1 1 L0 3 L-1 1 L-3 0 L-1 -1 Z"/>
    </g>
  </g>
</svg>
